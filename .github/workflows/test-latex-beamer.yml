name: Test LaTeX and Beamer Exports

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-latex-beamer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Export regression tests
        run: pnpm exec tsx --test tests/export/test-regressions.ts

      - name: Generate LaTeX files
        run: |
          pnpm tsx tests/export/test-latex-exports.ts
          pnpm tsx tests/export/test-beamer-exports.ts
          pnpm exec tsx tests/export/generate-examples.ts latex

      - name: Compile all LaTeX and Beamer examples to PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: 'test-*.tex'
          working_directory: test-output
          continue_on_error: true

      - name: Upload LaTeX artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latex-outputs
          path: |
            test-output/*.tex
            test-output/*.pdf
            test-output/*.log
          if-no-files-found: warn
          retention-days: 30
